server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `.webmanifest` fehlt in aelteren mime.types. Bewusst als default_type auf
    # der einen Location und nicht als `types`-Block: ein `types`-Block im
    # server-Kontext ersetzt die geerbte MIME-Tabelle vollstaendig, danach kaeme
    # sogar index.html als application/octet-stream und der Browser wuerde die
    # App herunterladen statt sie anzuzeigen.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Regenerated at container start (docker/generate-runtime-config.sh) -
    # never cache it, otherwise a new container with new env vars won't
    # take effect without a hard refresh.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Der Service Worker und sein Manifest duerfen nicht aus einem HTTP-Cache
    # kommen: an ngsw.json erkennt der Worker, ob es eine neue Version gibt.
    # Wird die Datei gecacht, findet er sie nie und die App bleibt auf dem
    # alten Stand stehen.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    location = /safety-worker.js {
        add_header Cache-Control "no-cache";
    }

    # Gehashte Build-Artefakte koennen dauerhaft gecacht werden, ihr Name
    # aendert sich mit dem Inhalt.
    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback - replaces firebase.json's hosting.rewrites.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
