@if (allChartsReady) {
<div class="flex-container">
  @if (showWL) {
  <div>
    <canvas
      baseChart
      [data]="doughnutChartDataWL"
      [type]="doughnutChartType"
      [options]="doughnutChartOptions">
    </canvas>
  </div>
  } @if (showDD) {
  <div>
    <canvas
      baseChart
      [data]="doughnutChartDataDD"
      [type]="doughnutChartType"
      [options]="doughnutChartOptions">
    </canvas>
  </div>
  } @if (showStats) {
  <div>
    <canvas
      baseChart
      [data]="doughnutChartDataStats"
      [type]="doughnutChartType"
      [options]="doughnutChartOptions">
    </canvas>
  </div>
  }
</div>
}
